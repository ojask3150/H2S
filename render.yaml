services:
  - type: web
    name: h2s-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GEE_MODE
        value: static
      - key: MET_SOURCES
        value: static
      - key: REASONING_ENGINE
        value: deterministic
      - key: LOG_LEVEL
        value: INFO
