services:
  - type: web
    name: h2s-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn aap.service:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHONPATH
        value: src
      - key: GEE_MODE
        value: static
      - key: MET_SOURCES
        value: static
      - key: REASONING_ENGINE
        value: deterministic
      - key: LOG_LEVEL
        value: INFO

  - type: web
    name: h2s-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -p $PORT
    healthCheckPath: /
    envVars:
      - key: BACKEND_URL
        fromService:
          type: web
          name: h2s-backend
          property: host
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
